<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Medical Information Extraction System</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark font-sans text-slate-100 flex items-center justify-center min-h-screen p-4 login-page">
  <div class="login-card">
    <div class="logo-box">
      <i data-lucide="activity"></i>
    </div>
    <h1>Medical Information Extraction System</h1>
    <p class="subtitle">Transforming Clinical Notes into Structured Medical Insights</p>

    <div class="demo-box">
      <div class="demo-title">
        <i data-lucide="shield-check"></i> Demo Credentials
      </div>
      <div class="demo-info">
        <div>Email: <strong>admin@medicalnpl.com</strong></div>
        <div>Password: <strong>Admin@123</strong></div>
      </div>
      <button type="button" class="btn-demo" onclick="fillDemo()">Auto Fill Credentials</button>
    </div>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST" class="auth-form">
      <div class="form-group">
        <label>Email / Username</label>
        <input type="email" id="email" name="email" required placeholder="admin@medicalnpl.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" required placeholder="••••••••">
          <button type="button" class="toggle-pw" onclick="togglePassword()">
            <i data-lucide="eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" name="remember"> Remember Me
        </label>
      </div>

      <button type="submit" class="btn-primary">Login to System</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register">Create Account / Register</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
    function fillDemo() {
      document.getElementById('email').value = 'admin@medicalnpl.com';
      document.getElementById('password').value = 'Admin@123';
    }
  </script>
</body>
</html>
