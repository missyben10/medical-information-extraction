<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration | Medical Information Extraction System</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark font-sans text-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="login-card">
    <div class="logo-box">
      <i data-lucide="user-plus"></i>
    </div>
    <h1>Create New Account</h1>
    <p class="subtitle">Medical Information Extraction System</p>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form action="/register" method="POST" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required placeholder="Dr. Sarah Jenkins">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="sarah.jenkins@hospital.org">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary">Register & Login</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Back to Login</a>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
